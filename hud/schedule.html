<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LPL S5 · Match schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=block" rel="stylesheet" />
  <style>
    .tm { position: absolute; display: flex; align-items: center; }
    .tm .lg { position: relative; flex: none; }
    .tm .lg img { width: 100%; height: 100%; object-fit: contain; }
    .tm .lg .holo { position: absolute; inset: 0; opacity: 0; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat;
      background: linear-gradient(115deg, transparent 0 40%, rgba(255,139,216,.95) 45%, #ffe1a8 47.5%, #8bffd9 50%, #7ad8ff 52.5%, #b47cff 55%, transparent 60% 100%); background-size: 300% 100%; }
    .tm .nm { font-weight: 700; text-transform: uppercase; line-height: 1.02; color: var(--cream); }
    .time { position: absolute; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .vsx { position: absolute; color: var(--gold); font-weight: 800; transform: translateX(-50%); }
    /* строки (3–4 матча) */
    .row { position: absolute; --k: 22px; }
    .row .div { position: absolute; width: 2px; background: rgba(242,203,117,.8); }
    /* карточки (2 матча) */
    .card { position: absolute; --k: 30px; }
    .card .ttl { position: absolute; left: 0; right: 0; text-align: center; color: var(--gold); font-weight: 800; font-size: 52px; }
    .stack { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 22px; transform: translateX(-50%); }
    .stack .lg { position: relative; }
    .stack .nm { font-weight: 700; text-transform: uppercase; text-align: center; white-space: nowrap; }
    .glines { position: absolute; height: 3px; background: var(--gold); }
    /* VS всегда ровно между командами, с одинаковыми отступами, как бы ни были длинны названия */
    .pair { position: absolute; top: 0; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; }
    .pair .tm { position: relative; }
    .pair .tm.a { justify-self: end; }
    .pair .tm.b { justify-self: start; }
    .pair .vs2 { color: var(--gold); font-weight: 800; }
    .duo { position: absolute; display: flex; align-items: flex-start; transform: translateX(-50%); }
    .duo .stack { position: relative; transform: none; }
    .duo .vs2 { color: var(--gold); font-weight: 800; line-height: 1; }
    .char { position: absolute; pointer-events: none; will-change: transform; }
  </style>
</head>
<body>
<script type="module">
  import { gsap, accent, cssUrl, el, at, pic, days, fmtTime, fmtLongDay, wantedDay, teamLogo, q, now } from './hud.js';
  import { board, crystal } from './board.js';
  await document.fonts.ready;

  // день: ?day=21.11, иначе сегодня (CET); если сегодня матчей нет — ближайший день с матчами
  const all = await days();
  const want = wantedDay();
  let day = all.find((d) => d.id === want) || all.find((d) => d.id > want) || all[all.length - 1];
  const list = (day?.matches || []).slice(0, 4);
  const n = Math.max(1, Math.min(4, +q('layout') || list.length || 1));
  const dateTxt = day ? fmtLongDay(day.matches[0].at) : '';

  const B = board({ head: 'MATCH SCHEDULE', date: dateTxt, dateLine: 400 });
  const C = B.content, K = B.back, tl = B.tl;
  const name = (t) => (t ? t.name : 'TBD');
  const fit = (s, big, small, lim = 12) => (s.length > lim ? small : big);

  function team(parent, t, size, nameSize, gap, maxW, cls) {
    const w = el('div', 'tm ' + cls, parent); w.style.gap = gap + 'px'; w.style.height = size + 'px';
    const lg = el('div', 'lg', w); lg.style.width = lg.style.height = size + 'px';
    const src = teamLogo(t);
    if (src) { pic(src, '', lg); const h = el('i', 'holo', lg); h.style.setProperty('--m', cssUrl(src)); }
    // длинное название — в две строки и мельче, чтобы не наезжать на VS
    const long = name(t).length > 9;
    const nm = el('div', 'nm', w, name(t)); nm.style.fontSize = (long ? nameSize * 0.78 : nameSize) + 'px';
    nm.style.maxWidth = maxW + 'px'; nm.style.whiteSpace = long ? 'normal' : 'nowrap';
    return w;
  }
  function stackTeam(parent, t, size, nameSize) {
    const w = el('div', 'stack', parent);
    const lg = el('div', 'lg', w); lg.style.width = lg.style.height = size + 'px';
    const src = teamLogo(t);
    if (src) { pic(src, '', lg).style.cssText = 'width:100%;height:100%;object-fit:contain'; const h = el('i', 'holo', lg); h.style.setProperty('--m', cssUrl(src)); h.style.cssText += ';position:absolute;inset:0;opacity:0;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background:linear-gradient(115deg,transparent 0 40%,rgba(255,139,216,.95) 45%,#ffe1a8 47.5%,#8bffd9 50%,#7ad8ff 52.5%,#b47cff 55%,transparent 60% 100%);background-size:300% 100%'; }
    const nm = el('div', 'nm', w, name(t)); nm.style.fontSize = fit(name(t), nameSize, nameSize * 0.78) + 'px';
    return w;
  }
  const time = (m) => (m ? `${fmtTime(m.at)} CET` : 'TBD');

  if (n >= 3) {
    // строки + персонаж справа
    const four = n === 4;
    const ch = pic(four ? 'img/char-2.webp' : 'img/char-1.webp', 'char', K);
    Object.assign(ch.style, four ? { left: '760px', top: '-20px', height: '1110px' } : { left: '1080px', top: '20px', height: '1060px' });
    gsap.to(ch, { y: -10, duration: 6, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    tl.fromTo(ch, { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 1.3, ease: 'main' }, 0.35);
    const G = four ? { x: 47, w: 1203, h: 112, ys: [330, 476, 622, 768], tx: 46, dv: 331, l1: 368, n1: 463, vs: 743, l2: 815, n2: 910, lg: 70, nm: 36, tm: 50 }
                   : { x: 75, w: 1205, h: 157, ys: [345, 536, 727], tx: 47, dv: 332, l1: 370, n1: 465, vs: 712, l2: 818, n2: 915, lg: 74, nm: 38, tm: 52 };
    const rows = [];
    for (let i = 0; i < n; i++) {
      const m = list[i];
      const r = at(el('div', 'row chamfer', C), G.x, G.ys[i], G.w, G.h);
      const t = at(el('div', 'time', r, time(m)), G.tx, 0); t.style.cssText += `;top:50%;transform:translateY(-50%);font-size:${G.tm}px`;
      const d = at(el('i', 'div', r), G.dv, G.h * 0.2); d.style.height = G.h * 0.6 + 'px';
      // пара команд: [лого имя] VS [лого имя], VS в центре своей зоны, отступы до него одинаковые
      const pr = el('div', 'pair', r); pr.style.left = G.dv + 30 + 'px'; pr.style.width = G.w - G.dv - 60 + 'px'; pr.style.columnGap = '34px';
      const half = (G.w - G.dv - 60 - 34 * 2 - 70) / 2 - G.lg - 22;
      team(pr, m?.a, G.lg, G.nm, 22, half, 'a');
      const v = el('div', 'vs2', pr, 'VS'); v.style.fontSize = G.tm - 6 + 'px';
      team(pr, m?.b, G.lg, G.nm, 22, half, 'b');
      rows.push(r);
    }
    rows.forEach((r, i) => {
      tl.fromTo(r, { clipPath: 'inset(0 100% 0 0)', x: -30 }, { clipPath: 'inset(0 0% 0 0)', x: 0, duration: 0.9, ease: 'main' }, 0.75 + i * 0.12);
      tl.fromTo(r.querySelectorAll('.lg'), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'main', stagger: 0.08 }, 1.05 + i * 0.12);
    });
    crystal(K, 'img/crystal-b.webp', four ? 1080 : 1150, -40, 420, { rot: -8, amp: 9, dur: 6.5 });
  } else if (n === 2) {
    const cards = [[88, 852], [977, 852]];
    crystal(C, 'img/crystal-a.webp', 60, 330, 250, { rot: 8, amp: 6 });
    crystal(C, 'img/crystal-b.webp', 780, 690, 230, { rot: 170, amp: 7, delay: 1 });
    crystal(C, 'img/crystal-a.webp', 940, 320, 250, { rot: 8, amp: 6, delay: 0.6 });
    crystal(C, 'img/crystal-b.webp', 1660, 690, 240, { rot: 170, amp: 7, delay: 1.6 });
    cards.forEach(([x, w], i) => {
      const m = list[i];
      const c = at(el('div', 'card chamfer', C), x, 358, w, 450);
      at(el('div', 'ttl', c, time(m)), 0, 62);
      const duo = at(el('div', 'duo', c), w / 2, 146); duo.style.gap = '56px';
      stackTeam(duo, m?.a, 150, 40);
      const v = el('div', 'vs2', duo, 'VS'); v.style.cssText += ';font-size:72px;margin-top:39px';
      stackTeam(duo, m?.b, 150, 40);
      tl.fromTo(c, { opacity: 0, y: 40, clipPath: 'inset(50% 0 50% 0)' }, { opacity: 1, y: 0, clipPath: 'inset(0% 0 0% 0)', duration: 1, ease: 'main' }, 0.8 + i * 0.15);
      tl.fromTo(c.querySelectorAll('.stack'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: 'main', stagger: 0.1 }, 1.2 + i * 0.15);
      tl.fromTo(v, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.6, ease: 'main' }, 1.4 + i * 0.15);
    });
  } else {
    // один матч в кристальной рамке
    const m = list[0];
    const fr = pic('img/frame-crystal.webp', 'crystal', C);
    Object.assign(fr.style, { left: '14px', top: '262px', width: '1888px' });
    // рамка не «дышит» и не сжимается — только проявляется со вспышкой
    tl.fromTo(fr, { opacity: 0, filter: 'brightness(2.2) blur(6px)' }, { opacity: 1, filter: 'brightness(1) blur(0px)', duration: 1.3, ease: 'main' }, 0.5);
    const tt = at(el('div', 'time', C, time(m)), 960, 384); tt.style.cssText += ';transform:translateX(-50%);color:var(--gold);font-size:58px';
    const l1 = at(el('i', 'glines', C), 615, 413, 100), l2 = at(el('i', 'glines', C), 1205, 413, 100);
    const duo = at(el('div', 'duo', C), 960, 462); duo.style.gap = '90px';
    const A = stackTeam(duo, m?.a, 210, 58);
    const v = el('div', 'vs2', duo, 'VS'); v.style.cssText += ';font-size:92px;margin-top:59px';
    const Bt = stackTeam(duo, m?.b, 210, 58);
    tl.fromTo([tt, l1, l2], { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.6, ease: 'main', stagger: 0.08 }, 1.0)
      .fromTo(A, { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 1, ease: 'main' }, 1.05)
      .fromTo(Bt, { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 1, ease: 'main' }, 1.05)
      .fromTo(v, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.7, ease: 'main' }, 1.35);
  }

  // holo-волна по логотипам команд — один проход в общей очереди бликов
  const holos = [...C.querySelectorAll('.holo')];
  accent(() => {
    const ht = gsap.timeline();
    holos.forEach((h, i) => {
      ht.fromTo(h, { backgroundPosition: '-400px 0', opacity: 0 }, { backgroundPosition: '200px 0', duration: 1.3, ease: 'sine.inOut' }, i * 0.2)
        .to(h, { opacity: 0.85, duration: 0.4 }, i * 0.2).to(h, { opacity: 0, duration: 0.6 }, i * 0.2 + 0.7);
    });
    return ht;
  });
</script>
</body>
</html>
