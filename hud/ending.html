<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LPL S5 · Thanks for watching</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=block" rel="stylesheet" />
</head>
<body>
<script type="module">
  import { sideScene } from './side.js';
  import { gsap, el, at } from './hud.js';
  await document.fonts.ready;
  sideScene({
    art: 'ending',
    lines: ['THANKS FOR', 'WATCHING'], titleY: 330, size: 137, pitch: 122,
    sub: 'LEGENDS WERE MADE', subY: 610,
    line: [426, 678],
    hue: 20,
    flares: [[1460, 135, 1], [1805, 160, 0.7], [1575, 410, 0.5], [1290, 260, 0.45]], flareEvery: 6,
    motes: [18, [950, 300, 950, 600]],
    extra(S, fx) {
      // трофей светится изнутри
      const g = at(el('div', 'glow', fx), 1150, 180, 700, 620);
      gsap.fromTo(g, { opacity: 0.22 }, { opacity: 0.36, duration: 8, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      // золотые хлопья медленно падают и вращаются
      for (let i = 0; i < 12; i++) {
        const f = el('i', '', fx);
        const w = 8 + Math.random() * 14;
        Object.assign(f.style, { position: 'absolute', left: 0, top: 0, width: w + 'px', height: w * 0.55 + 'px', background: 'linear-gradient(135deg,#fff3c4,#e0a94a 60%,#9a6a22)', clipPath: 'polygon(0 50%,40% 0,100% 50%,60% 100%)', opacity: 0, mixBlendMode: 'screen' });
        const x = 900 + Math.random() * 1000, d = 12 + Math.random() * 8;
        gsap.timeline({ repeat: -1, delay: -Math.random() * d })
          .fromTo(f, { x, y: -40, rotation: Math.random() * 360 }, { x: x + (Math.random() - 0.5) * 220, y: 1000, rotation: '+=' + (200 + Math.random() * 300), duration: d, ease: 'none' }, 0)
          .to(f, { opacity: 0.6, duration: 2, ease: 'sine.out' }, 0)
          .to(f, { opacity: 0, duration: 1.5, ease: 'sine.in' }, d - 1.5);
      }
    },
  });
</script>
</body>
</html>
