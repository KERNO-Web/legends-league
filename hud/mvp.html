<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LPL S5 · Match MVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=block" rel="stylesheet" />
  <style>
    .nick { position: absolute; left: 1262px; top: 352px; transform: translateX(-50%); font-weight: 700; font-size: 96px; line-height: 1; white-space: nowrap; letter-spacing: -0.01em; }
    .kda { position: absolute; top: 466px; width: 200px; transform: translateX(-50%); text-align: center; }
    .kda span { display: block; font-weight: 700; font-size: 44px; line-height: 1; }
    .kda b { display: block; margin-top: 30px; font-weight: 800; font-size: 136px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .vdiv { position: absolute; top: 468px; width: 2px; height: 178px; background: var(--gold); transform-origin: 50% 0; }
    .mvpsub { position: absolute; left: 1262px; top: 680px; transform: translateX(-50%); font-weight: 700; font-size: 30px; white-space: nowrap; letter-spacing: .01em; }
  </style>
</head>
<body>
<script type="module">
  import { gsap, el, at, q, flares, motes, shimmer, drift } from './hud.js';
  import { board } from './board.js';
  await document.fonts.ready;

  // ?name=Bruuu_uuuh&k=12&d=3&a=9 — ник и статистика игрока
  const B = board({ head: 'MATCH MVP', date: '', dateLine: 0, ruleY: 0, bg: 'img/art-mvp.webp', mask: 'img/mask-mvp.webp', headAt: [120, 72] });
  const C = B.content, tl = B.tl;
  drift(B.cam, { s: 1.03, x: 10, y: -6, dur: 18 });
  // перелив по кристаллам и ленте рамки
  const lit = B.bgW.querySelector('.lit');
  const sh = el('div', 'shimmer', lit); sh.style.backgroundImage = 'url(img/art-mvp.webp)'; lit.prepend(sh);
  shimmer(sh, 24, 8);
  flares(B.fx, [[700, 330, 0.9], [1860, 300, 0.6], [1620, 805, 0.5], [210, 255, 0.5]], 6);
  motes(B.fx, 22, [100, 250, 1700, 650]);

  const name = q('name', 'Bruuu_uuuh');
  const nick = el('div', 'nick', C, name);
  if (name.length > 14) nick.style.fontSize = '76px';
  const cols = [['K', +q('k', 12), 973], ['D', +q('d', 3), 1262], ['A', +q('a', 9), 1550]];
  const nums = cols.map(([l, v, x]) => { const k = at(el('div', 'kda', C, `<span>${l}</span><b>0</b>`), x, 466); return [k, v]; });
  const dv = [1117, 1407].map((x) => at(el('i', 'vdiv', C), x, 468));
  const sub = el('div', 'mvpsub', C, 'MOST VALUABLE PLAYER');

  tl.fromTo(nick, { opacity: 0, y: 30, filter: 'blur(10px)', letterSpacing: '0.12em' }, { opacity: 1, y: 0, filter: 'blur(0px)', letterSpacing: '-0.01em', duration: 1.1, ease: 'main' }, 0.8)
    .fromTo(dv, { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: 'main', stagger: 0.1 }, 1.1)
    .fromTo(nums.map(([k]) => k), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: 'main', stagger: 0.1 }, 1.2)
    .fromTo(sub, { opacity: 0, letterSpacing: '0.25em' }, { opacity: 1, letterSpacing: '0.01em', duration: 1, ease: 'main' }, 1.6);
  // цифры отсчитываются от нуля
  nums.forEach(([k, v], i) => {
    const o = { n: 0 }, b = k.querySelector('b');
    tl.to(o, { n: v, duration: 1.1, ease: 'power2.out', onUpdate: () => { b.textContent = Math.round(o.n); } }, 1.3 + i * 0.12);
  });
  // ник иногда вспыхивает золотом
  gsap.timeline({ delay: 4, repeat: -1, repeatDelay: 8 })
    .to(nick, { textShadow: '0 0 28px rgba(255,214,150,.65)', color: '#fff6dc', duration: 0.5, ease: 'sine.out' })
    .to(nick, { textShadow: '0 0 0 rgba(255,214,150,0)', color: '#f2ede0', duration: 1, ease: 'sine.in' });
</script>
</body>
</html>
