<!doctype html>
<html lang="en">
<head>

<body>
<script type="module">
  import { q } from './hud.js';

    frameScene({
      windows: [{ x: 400, y: 125, w: 1120, h: 597, k: 30 }],
      crystals: [
        ['img/crystal-a.webp', -70, 40, 520, 0],
        ['img/crystal-b.webp', 1560, 50, 380, 6],
        ['img/crystal-a.webp', -90, 520, 360, 0, 'y'],
        ['img/crystal-a.webp', 1650, 520, 360, 0, 'xy'],
      ],
      brandAt: [777, 18], brandW: 270, foot: false, topSponsors: [512, 31, 420], fadeBottom: 720,
    });
  } else {
    frameScene({
      windows: [{ x: 262, y: 168, w: 1395, h: 743, k: 34 }],
      crystals: [
        ['img/crystal-a.webp', -70, 50, 540, 0],
        ['img/crystal-b.webp', 1560, 95, 400, 6],
        ['img/crystal-a.webp', -90, 640, 380, 0, 'y'],
        ['img/crystal-a.webp', 1630, 640, 380, 0, 'xy'],
      ],
      brandAt: [756, 44], brandW: 308,
    });
  }
</script>
