<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LPL S5 · Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=block" rel="stylesheet" />
</head>
<body>
<script type="module">
  import { sideScene } from './side.js';
  import { gsap, el, at } from './hud.js';
  await document.fonts.ready;
  sideScene({
    art: 'offline',
    lines: ['OFFLINE'], titleY: 387, size: 196, pitch: 160,
    sub: 'THE ARENA WILL AWAKEN', subY: 576,
    line: [486, 639],
    hue: 22,
    flares: [[1440, 52, 0.9], [1835, 520, 0.5], [1150, 95, 0.45], [1690, 760, 0.4]], flareEvery: 8,
    motes: [30, [900, 250, 1020, 750]],
    extra(S, fx) {
      // свет из щели дверей «дышит»
      const door = at(el('div', 'glow', fx), 1300, 330, 300, 520);
      gsap.fromTo(door, { opacity: 0.25, scaleY: 0.92 }, { opacity: 0.6, scaleY: 1.04, duration: 3.2, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      // туман стелется по полу двумя слоями навстречу
      const f1 = at(el('div', 'fog', fx), 0, 690); f1.style.height = '300px';
      const f2 = at(el('div', 'fog', fx), 0, 760); f2.style.height = '260px';
      gsap.fromTo(f1, { xPercent: -6, opacity: 0.55 }, { xPercent: 6, opacity: 0.85, duration: 14, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      gsap.fromTo(f2, { xPercent: 7, opacity: 0.4 }, { xPercent: -5, opacity: 0.7, duration: 11, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    },
  });
</script>
</body>
</html>
